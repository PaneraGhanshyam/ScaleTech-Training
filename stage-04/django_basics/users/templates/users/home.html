{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>User App</title>
    <link rel="stylesheet" href="{% static 'users/style.css' %}">
</head>
<body>

    <h1>Users</h1>

    {% for user in users %}
        <div class="user">
            <strong>{{ user.name }}</strong> -
            {{ user.email }} -
            {{ user.age }}
        </div>
    {% empty %}
        <p>No users found.</p>
    {% endfor %}

</body>
</html>
