<!DOCTYPE html>
<html>
<head>
    <title>Documents</title>
</head>
<body>

    <h1>Documents</h1>

    {% for document in documents %}
        <h2>{{ document.title }}</h2>
        <p>{{ document.content }}</p>
        <p>Created by: {{ document.created_by.username }}</p>
    {% empty %}
        <p>No documents found.</p>
    {% endfor %}

</body>
</html>
